name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'package.json' # Ideally, we only publish when package version changes

jobs:
  publish:
    name: Publish to Registries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          # We use a placeholder for registry-url, we will define .npmrc dynamically in steps
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build Framework
        run: npm run build

      - name: Publish to Azure Artifacts
        run: |
          # Generate .npmrc for Azure
          echo "@YOUR_SCOPE:registry=https://pkgs.dev.azure.com/YOUR_ORG/_packaging/YOUR_FEED/npm/registry/" > .npmrc
          echo "always-auth=true" >> .npmrc
          echo "//pkgs.dev.azure.com/YOUR_ORG/_packaging/YOUR_FEED/npm/registry/:_authToken=\${AZURE_NPM_TOKEN}" >> .npmrc
          
          # Publish
          npm publish
        env:
          AZURE_NPM_TOKEN: ${{ secrets.AZURE_NPM_TOKEN }}

      - name: Publish to JFrog Artifactory
        run: |
          # Overwrite .npmrc for JFrog
          echo "@YOUR_SCOPE:registry=https://YOUR_COMPANY.jfrog.io/artifactory/api/npm/npm-repo/" > .npmrc
          echo "always-auth=true" >> .npmrc
          echo "//YOUR_COMPANY.jfrog.io/artifactory/api/npm/npm-repo/:_authToken=\${JFROG_NPM_TOKEN}" >> .npmrc
          
          # Publish
          npm publish
        env:
          JFROG_NPM_TOKEN: ${{ secrets.JFROG_NPM_TOKEN }}
