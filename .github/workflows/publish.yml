name: Publish Packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish to Registries
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating tags, releases, and pushing CHANGELOG.md
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by semantic-release to read full git history

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Framework
        run: npm run build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_NPM_TOKEN: ${{ secrets.AZURE_NPM_TOKEN }}
          JFROG_NPM_TOKEN: ${{ secrets.JFROG_NPM_TOKEN }}
        run: npx semantic-release
